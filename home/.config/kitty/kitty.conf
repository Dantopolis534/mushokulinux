# =============================================================================
#  cyberArch-Dotfiles :: Mushoku Tensei
#  kitty/kitty.conf  --  Módulo de magia
#  Requiere: kitty + ttf-jetbrains-mono-nerd
# =============================================================================

# --- Fuente y tamano --------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# --- Ventana ----------------------------------------------------------------
confirm_os_window_close 0
confirm_window_close 0

window_padding_width 7 8 6 9
margin                0

# Borders: el trazo de luz del hechizo
draw_border                     true
draw_miniframes                 true
border_color                    #9B7BD4
inactive_border_color           #26304F
bell_border_color               #FF5F56

# --- Cursor -----------------------------------------------------------------
cursor            beam
cursor_style      beam
cursor_beam_thickness 1.4

# --- Copy-on-select y scrollback --------------------------------------------
copy_on_select              yes
url_handler                 default
scrollback_pager            less --quit-if-one-screen
scrollback                  10000
mouse_hide_wait             3.0
url_style                   curly,powerline,link_color=#5BC8FF,url_color=#E0B354

# --- Tabes y paneles --------------------------------------------------------
tab_bar            top
tab_bar_style      powerline
tab_powerline_style slanted
active_tab_background   #5BC8FF
active_tab_foreground   #080A12
inactive_tab_background #121729
inactive_tab_foreground #8E9AB8
tab_bar_background      #0B0E1A
tab_title_first_only    no

# --- Colores: Mushoku Tensei -----------------------------------------------
foreground #C9D4E8
background #0B0E1A

cursor                  #ECEFF8
cursor_text_color       #080A12
selection_background    #26304F
selection_foreground    #ECEFF8

url_color               #E0B354
url_hover_color         #5BC8FF

# ventana activa
active_border_color     #5BC8FF
active_tab_background   #5BC8FF
active_tab_foreground   #080A12

# ventana inactiva
inactive_border_color   #26304F
inactive_tab_background #121729
inactive_tab_foreground #8E9AB8

# --- Campana (bell) ------------------------------------------------------
bell_border_color #FF5F56

# --- Ratones ----------------------------------------------------------------
# Scroll natural: lo correcto para un touchpad
scrollback_pager_inherit_scrollback yes
wheel_scroll_multiplier 1.0
touch_scroll_multiplier  3.0

# --- Atajos -----------------------------------------------------------------
map ctrl+shift+up    launch --type=overlay --background-opacity=0.92 title_bar=false kitten icat
map ctrl+shift+left  move_tab_left
map ctrl+shift+right move_tab_right
map ctrl+shift+t      new_tab
map ctrl+shift+w      close_tab
map ctrl+shift+s      save_scrollback

# divide screen (horizontal)
map ctrl+shift+enter launch --location=hsplit
# divide screen (vertical)
map ctrl+shift+d     launch --location=vsplit

map super+enter       goto_tab 1
map super+right       goto_tab +1
map super+left        goto_tab -1

# --- Layouts ----------------------------------------------------------------
enabled_layouts tiled,stack,floating,tall,grid,horizontal,vertical,spiral
window_padding_width 7 8 6 9

# --- Sound ------------------------------------------------------------------
# Sin campanas del sistema: el destino esta en silencio.
# Descomenta si prefieres audio
# bell_interval 0
