# =============================================================================
#  conf.d/envs.conf -- Variables y entorno de la sesion
# =============================================================================

# XC_SHELL se expande en Hyprland a %s (shell de login del usuario).
env = XC_SHELL,             %s
env = XC_TERM,              kitty
env = XC_MENU,              rofi -show drun -show-icons
env = XC_LOCK,              hyprlock
env = XC_SCREENSHOT_DIR,    /home/%U/capturas

env = XC_WALLPAPER_DIR,     ~/.local/share/wallpapers/mushoku

# Locale / teclado
env = XC_LANG,              es_ES.UTF-8
env = HYPRLAND_LOG_WLR,     1

# Hyprpaper (Mushoku Tensei)
env = XC_WALLPAPER,         ${XC_WALLPAPER_DIR}/fittoa.png
