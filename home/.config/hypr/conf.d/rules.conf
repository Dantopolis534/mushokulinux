# =============================================================================
#  conf.d/rules.conf -- Reglas de ventanas
#  (transparencias, flotantes, dimensiones, prioridad)
# =============================================================================

# --- Flotantes --------------------------------------------------------------
windowrule = float,  calculator
windowrule = float,  qalculate-gtk
windowrule = float,  org.gnome.Calculator
windowrule = float,  pavucontrol
windowrule = float,  blueman-manager
windowrule = float,  nm-connection-editor
windowrule = float,  polkit-gnome-authentication-agent-1
windowrule = float,  hyprlock
windowrule = float,  file_progress
windowrule = float,  confirm
windowrule = float,  dialog
windowrule = float,  download
windowrule = float,  notification
windowrule = float,  error
windowrule = float,  splash
windowrule = float,  mpc-qt
windowrule = float,  xdg-desktop-portal-gtk

# --- Opacidad de overlays ---------------------------------------------------
windowrule = opacity 0.94,  waybar
windowrule = opacity 0.96,  rofi
windowrule = opacity 0.97,  dunst
windowrule = opacity 0.98,  kitty
windowrule = opacity 0.98,  alacritty
windowrule = opacity 0.98,  foot

# --- Juegos: sin dim, sin sombra, a pantalla completa ------------------------
windowrule = fullscreen, ^(.*steam_app_.*)$
windowrule = noblur,     ^(.*steam_app_.*)$
windowrule = noshadow,   ^(.*steam_app_.*)$
windowrule = nodim,      ^(.*steam_app_.*)$
windowrule = opacity 1.0, ^(.*steam_app_.*)$
windowrule = suppressevent maximize, ^(.*steam_app_.*)$

# --- Multimedia: desactiva blur para saving en la iGPU ---------------------
windowrule = noblur,  ^(.*mpv.*)$
windowrule = noblur,  ^(.*vlc.*)$

# --- Navegadores -----------------------------------------------------------
windowrule = noblur,  ^(.*firefox.*)$
windowrule = noblur,  ^(.*chromium.*)$
windowrule = noblur,  ^(.*brave.*)$

# --- Tamanos fijos para utilidades -----------------------------------------
windowrule = size 880 620,  pavucontrol
windowrule = center,       pavucontrol
windowrule = size 900 620,  blueman-manager
windowrule = center,       blueman-manager
windowrule = size 960 700,  nm-connection-editor
windowrule = center,       nm-connection-editor

# --- Foco ------------------------------------------------------------------
windowrule = stayfocused,  polkit-gnome-authentication-agent-1
windowrule = dimaround,     rofi
