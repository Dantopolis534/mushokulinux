# =============================================================================
#  conf.d/binds.conf -- Keybindings (mapa verificado, sin colisiones)
#
#   SUPERSETE   tecla Windows a la derecha
#   CTRL / ALT / SHIFT   modificadores
#
#   1..6  =  las seis paginas del laberinto (workspaces)
# =============================================================================

# --- Terminal y lanzadores ---------------------------------------------------
bind = $mainMod,        Return,  exec, $XC_TERM
bind = $mainMod,        T,       exec, $XC_TERM
bind = $mainMod,        D,       exec, $XC_MENU
bind = $mainMod,        E,       exec, $XC_TERM -e nvim
bind = $mainMod,        B,       exec, $XC_TERM -e btop
bind = $mainMod shift,  T,       exec, thunar
bind = $mainMod shift,  D,       exec, $XC_MENU -show window
bind = $mainMod ctrl,   T,       exec, firefox
bind = $mainMod ctrl,   B,       exec, discord

# --- Mover ventanas ----------------------------------------------------------
bind = $mainMod, H,     movewindow, l
bind = $mainMod, J,     movewindow, d
bind = $mainMod, K,     movewindow, u
bind = $mainMod, L,     movewindow, r

bind = $mainMod, Left,  movewindow, l
bind = $mainMod, Down,  movewindow, d
bind = $mainMod, Up,    movewindow, u
bind = $mainMod, Right, movewindow, r

# --- Foco -------------------------------------------------------------------
bind = $mainMod shift, H,       focusdir, l
bind = $mainMod shift, J,       focusdir, d
bind = $mainMod shift, K,       focusdir, u
bind = $mainMod shift, L,       focusdir, r

bind = $mainMod shift, Left,    focusdir, l
bind = $mainMod shift, Down,    focusdir, d
bind = $mainMod shift, Up,      focusdir, u
bind = $mainMod shift, Right,   focusdir, r

# --- Redimensionar -----------------------------------------------------------
bind = $mainMod alt,         Left,  resizeactive, -20 0
bind = $mainMod alt,         Right, resizeactive,  20 0
bind = $mainMod alt,         Up,    resizeactive, 0 -20
bind = $mainMod alt,         Down,  resizeactive, 0   20
bind = $mainMod alt shift,   Left,  resizeactive, -60 0
bind = $mainMod alt shift,   Right, resizeactive,  60 0
bind = $mainMod alt shift,   Up,    resizeactive, 0 -60
bind = $mainMod alt shift,   Down,  resizeactive, 0   60

# --- Workspaces: las paginas del laberinto -----------------------------------
bind = $mainMod, 1,             workspace, 1
bind = $mainMod, 2,             workspace, 2
bind = $mainMod, 3,             workspace, 3
bind = $mainMod, 4,             workspace, 4
bind = $mainMod, 5,             workspace, 5
bind = $mainMod, 6,             workspace, 6

bind = $mainMod shift, 1,       movetoworkspace, 1
bind = $mainMod shift, 2,       movetoworkspace, 2
bind = $mainMod shift, 3,       movetoworkspace, 3
bind = $mainMod shift, 4,       movetoworkspace, 4
bind = $mainMod shift, 5,       movetoworkspace, 5
bind = $mainMod shift, 6,       movetoworkspace, 6

bind = $mainMod ctrl,      Left, moveactive, prev
bind = $mainMod ctrl,      Right, moveactive, next
bind = $mainMod ctrl shift, Left, swapactive, prev
bind = $mainMod ctrl shift, Right, swapactive, next

# --- Layouts ----------------------------------------------------------------
bind = $mainMod, M,             exec, hyprctl dispatch layout dwindle
bind = $mainMod, N,             exec, hyprctl dispatch layout master
bind = $mainMod, O,             exec, hyprctl dispatch layout tiledpq
bind = $mainMod, F,             exec, hyprctl dispatch fullscreen 0
bind = $mainMod, P,             exec, hyprctl dispatch pseudo
bind = $mainMod, V,             exec, hyprctl dispatch togglefloating
bind = $mainMod, W,             exec, hyprctl dispatch pin
bind = $mainMod, Space,         exec, hyprctl dispatch togglespecialworkspace
bind = $mainMod shift, Space,   exec, hyprctl dispatch movetoworkspace special

# --- Capturas (grim + slurp + swappy) ---------------------------------------
bind = $mainMod,         Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod shift,   Print, exec, grim - | wl-copy
bind = $mainMod alt,     Print, exec, bash -c 'grim -g "$(slurp)" -o "$XC_SCREENSHOT_DIR/$(date +%F_%H-%M-%S).png"'
bind = $mainMod ctrl,    Print, exec, bash -c 'grim -o "$XC_SCREENSHOT_DIR/$(date +%F_%H-%M-%S).png"'
bind = $mainMod,         C,     exec, bash -c 'grim -g "$(slurp)" -o "$XC_SCREENSHOT_DIR/$(date +%F_%H-%M-%S).png" && notify-send "Captura" "Mushoku Tensei :: captura guardada" -a "🖼️"'

# --- Volumen / Brillo / Media -----------------------------------------------
bind = ,XF86AudioRaiseVolume,   exec, wpctl set-volume -l 1.15 @DEFAULT_AUDIO_SINK@ 5%+
bind = ,XF86AudioLowerVolume,   exec, wpctl set-volume -l 1.15 @DEFAULT_AUDIO_SINK@ 5%-
bind = ,XF86AudioMute,          exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = ,XF86AudioMicMute,       exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bind = ,XF86AudioPlay,          exec, playerctl play-pause
bind = ,XF86AudioPause,         exec, playerctl play-pause
bind = ,XF86AudioStop,          exec, playerctl stop
bind = ,XF86AudioNext,          exec, playerctl next
bind = ,XF86AudioPrev,          exec, playerctl previous

bind = ,XF86MonBrightnessUp,    exec, brightnessctl set 5%+
bind = ,XF86MonBrightnessDown,  exec, brightnessctl set 5%-

bind = ,XF86Launch0,            exec, $XC_LOCK
bind = ,XF86Launch1,            exec, $XC_TERM -e nvim
bind = ,XF86Calculator,         exec, $XC_TERM -e qalc

# --- ASUS TUF: teclado retroiluminado y touchpad ----------------------------
bind = ,XF86KbdBrightnessUp,    exec, asusctl kbd_led set +1
bind = ,XF86KbdBrightnessDown,  exec, asusctl kbd_led set -1
bind = ,XF86KbdBacklightUp,     exec, asusctl kbd_led set +1
bind = ,XF86KbdBacklightDown,   exec, asusctl kbd_led set -1
bind = ,XF86TouchpadToggle,     exec, hyprctl keyword touchpad_tap_to_click toggle

# --- Sistema ----------------------------------------------------------------
bind = $mainMod,       Escape, exec, $XC_TERM --hold -e nmcli
bind = $mainMod shift, N,      exec, $XC_TERM --hold -e cat /etc/hypr/mushoku-tensei.txt
bind = $mainMod ctrl,  L,      exec, hyprlock
bind = $mainMod shift, Q,      exec, hyprctl dispatch exit
bind = $mainMod ctrl,  R,      exec, hyprctl reload
bind = $mainMod,       comma,  exec, hyprctl reload
bind = $mainMod,       period, exec, hyprctl keyword animations enabled toggle
