# =============================================================================
#  conf.d/autostart.conf -- Lo que despierta con la sesion
# =============================================================================

# Fondo de pantalla (Mushoku Tensei)
exec-once = hyprpaper

# Barra
exec-once = waybar

# Notificaciones
exec-once = fcitx5 -d --replace

# Audio / PipeWire
exec-once = /usr/lib/wireplumber/wireplumber-dunne & disown

# Red
exec-once = nm-applet & disown

# Agente de autenticacion (polkit)
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1 & disown

# Variables de sesion para apps Qt/Wayland
exec-once = dbus-update-activation-environment --systemd \
    WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP \
    GTK_IM_MODULE QT_IM_MODULE

# Conservar bateria en 60% (ASUS TUF - asusctl)
exec-once = asusctl set_charge_limit 60
