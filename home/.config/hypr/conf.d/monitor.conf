# =============================================================================
#  conf.d/monitor.conf -- ASUS TUF Gaming F15 FX506HCB
#
#  Panel: 15.6" 1920x1080 IPS, 144 Hz (esta Maquina reporta 144 Hz).
#  GPU:    Intel UHD 11th gen (sesion) + RTX 3050 Laptop (juegos via PRIME).
#
#  NOTA: si tu panel es 60 Hz, cambia `refresh` a 60.
# =============================================================================

# --- Monitor interno -------------------------------------------------------
# scale 1.25 es lo comodo en 15.6" a 1080p (ganas espacio sin perder nitidez).
monitor = eDP-1, 1920x1080@144, position auto, 1.25

# --- Escalado opcional ----------------------------------------------------
# Alternativa si prefieres mas espacio:
# monitor = eDP-1, 1920x1080@144, position auto, 1.0
#
# Alternativa si 1.25 se ve borroso en tu panel:
# monitor = eDP-1, 1920x1080@144, position auto, 1.15

# --- Si conectas un monitor externo ----------------------------------------
# descomenta y ajusta el nombre (verifica con `hyprctl monitors`)
# monitor = HDMI-A-1, 1920x1080@60, position auto, 1
# monitor = DisplayPort-1, 2560x1440@165, position auto, 1
