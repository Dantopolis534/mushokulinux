# =============================================================================
#  conf.d/theme.conf -- Las coordenadas de color del universo
#  Editar SOLO aqui para cambiar el "personaje" activo.
# =============================================================================

# --- Bases (fondo) ---------------------------------------------------------
$bg0 = rgba(080a12ee)     # el vacio de Hitogami
$bg1 = rgba(0b0e1af2)     # fondo base
$bg2 = rgba(121729f5)     # superficie elevada
$bg3 = rgba(1b2340f7)     # bordes, hover
$bg4 = rgba(26304fec)     # separadores

# --- Texto -----------------------------------------------------------------
$fg0 = rgba(eceff8ff)     # contraste maximo
$fg1 = rgba(c9d4e8ff)     # texto normal
$fg2 = rgba(8e9ab8ff)     # texto secundario
$fg3 = rgba(5c688aff)     # apagado

# --- Personajes ------------------------------------------------------------
$roxy     = rgba(5bc8ffff)   # Agua / Hielo    -- acento primario
$eris     = rgba(ff5f56ff)   # Fuego / Espada  -- errores
$sylphie  = rgba(5fd98aff)   # Viento          -- exito
$ghislaine= rgba(c9d4e8ff)   # Plata           -- texto claro
$rudeus   = rgba(e0b354ff)   # Oro / Magia     -- acento secundario
$hitogami = rgba(9b7bd4ff)   # Vacio           -- acento terciario
$lara     = rgba(b47bd4ff)   # Violeta         -- notas
$ruijerd  = rgba(8c6bd4ff)   # Obsidiana       -- tareas largas

# --- Ventanas --------------------------------------------------------------
col.active_border       = $roxy        rgb(5bc8ff)
col.active_border_inner = rgba(9b7bd455)
col.inactive_border     = $rudeus      rgba(e0b35455)

windowrulev2 = bordercolor,  ^(.*)$,     $roxy,   1
windowrulev2 = bordercolor,  ^(.*)$,     $rudeus, 0.35
windowrulev2 = bordercolor,  urgent,     $eris,   1
windowrulev2 = bordercolor,  fullscreen, $hitogami, 1

# --- Barra -----------------------------------------------------------------
$bar_bg    = rgba(0b0e1ae6)
$bar_fg    = $fg1
$bar_active_bg = $roxy
$bar_active_fg = $bg0
