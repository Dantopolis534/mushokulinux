# =============================================================================
#  conf.d/workspaces.conf -- Las seis paginas del laberinto
#  Cada workspace tiene un "guardin" (nombre) del universo Mushoku Tensei.
# =============================================================================

# --- Nombrado ---
# (hyprland usa los nombres en la barra; ver waybar/scripts/mushoku-status.sh)
workspace = 1, name:1  fittoa
workspace = 2, name:2  millishion
workspace = 3, name:3  asura
workspace = 4, name:4  sharia
workspace = 5, name:5  bosque
workspace = 6, name:6  labyrinth

# --- Reglas por workspace ---
# Mismo comportamiento para todos: mostrador por defecto, layout tiled.
default_workspace = 1, layout:tiledpq
default_workspace = 2, layout:tiledpq
default_workspace = 3, layout:tiledpq
default_workspace = 4, layout:tiledpq
default_workspace = 5, layout:master
default_workspace = 6, layout:tiledpq

# El workspace 6 (laberinto) guarda ventanas flotantes grandes:
# terminal de sistemas, monitor de red, htop.
workspace = 6, gaps_out:20
workspace = 6, gaps_in:8

# Workspace especial (Super+Space) para dialogues y herramientas multiples.
workspace = special, on-created-empty:kitty
