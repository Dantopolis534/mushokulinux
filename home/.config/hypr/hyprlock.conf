# =============================================================================
#  hyprlock.conf -- El sello del Laberinto
#  Muestrario de los Sello de los Dios (Orsted / Hitogami)
# =============================================================================

# --- Fondo -----------------------------------------------------------------
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.95
    brightness = 0.65
    vignette = 0.4
}

# --- Sin modulos de entrada complicados ------------------------------------
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.28
    outer_color = 9b7bd4ff
    inner_color = 121729e6
    font_color = eceff8ff
    fade_on_empty = true
    fade_timeout = 2
    placeholder_text = <i>El hechicero...</i>
    hide_input = false
    check_color = 5fd98aff
    fail_color = ff5f56ff
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fail_timeout = 2
    capslock_color = e0b354ff
    rounding = 8
    position = 0, -70
    halign = center
    valign = center
}

# --- Reloj con la hora del laberinto ----------------------------------------
label {
    monitor =
    text = cmd[update:60000] date +"%H:%M"
    color = eceff8ff
    font_size = 110
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d de %B - %Y"
    color = 8e9ab8ff
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# --- Usuario (tu nombre de reencarnacion) ----------------------------------
label {
    monitor =
    text = $USER
    color = 5bc8ffff
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

# --- Sello de Orsted -------------------------------------------------------
image {
    monitor =
    path = ~/.local/share/wallpapers/mushoku/sello-orsted.png
    size = 110
    position = 0, 240
    halign = center
    valign = center
}

# --- Silencio: recordatorio de la linea de tiempo --------------------------
label {
    monitor =
    text = "Musoshoku Tensei"
    color = 9b7bd4cc
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -260
    halign = center
    valign = center
}

# --- Apagado / suspender ---------------------------------------------------
container {
    monitor =
    center = true
    invert_colors = false
    ignore = false

    child = centerbox {
        spacing = 12

        child = button {
            text = "Apagar"
            icon_name = "system-shutdown"
            color = 8e9ab8ff
            background_color = 121729e6
            hover_color = eceff8ff
            hover_background_color = 26304fec
            border_color = 5bc8ff55
            border_size = 2
            rounding = 8
            on_click = "loginctl poweroff"
        }

        child = button {
            text = "Reiniciar"
            icon_name = "system-reboot"
            color = 8e9ab8ff
            background_color = 121729e6
            hover_color = eceff8ff
            hover_background_color = 26304fec
            border_color = 5bc8ff55
            border_size = 2
            rounding = 8
            on_click = "loginctl reboot"
        }

        child = button {
            text = "Suspender"
            icon_name = "weather-clear-night"
            color = 8e9ab8ff
            background_color = 121729e6
            hover_color = eceff8ff
            hover_background_color = 26304fec
            border_color = 5bc8ff55
            border_size = 2
            rounding = 8
            on_click = "loginctl suspend"
        }

        child = label {
            text = "ESC para cancelar"
            color = 5c688aff
            font_size = 12
            font_family = JetBrainsMono Nerd Font
        }
    }
}
