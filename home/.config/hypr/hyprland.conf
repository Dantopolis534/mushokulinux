# =============================================================================
#  cyberArch-Dotfiles :: Mushoku Tensei
#  hyprland.conf  --  Maestro. Solo delega en conf.d/
#  Target: ASUS TUF Gaming F15 FX506HCB (i5-11400H / Intel UHD + RTX 3050)
#  Sesion corre sobre la iGPU Intel. La RTX 3050 se usa via PRIME para juegos.
# =============================================================================

# ---- Variables globales ----------------------------------------------------
# $mainMod = la tecla Windows. Usa SUPER (cualquiera) o RSuper (solo la derecha).
$mainMod = SUPER

# ---- Personaje activo ------------------------------------------------------
# Cambiar estas 3 lineas = cambiar el "personaje" del escritorio.
$personaje      = Rudeus
$acento_principal  = #5BC8FF   # #5BC8FF Roxy | #FF5F56 Eris | #5FD98A Sylphie
                                                 # #E0B354 Rudeus | #9B7BD4 Hitogami
$acento_secundario = #E0B354

# ---- Carga de modulos ------------------------------------------------------
# El orden importa: envs y monitor primero, binds al final.
source = ~/.config/hypr/conf.d/envs.conf
source = ~/.config/hypr/conf.d/monitor.conf
source = ~/.config/hypr/conf.d/theme.conf
source = ~/.config/hypr/conf.d/workspaces.conf
source = ~/.config/hypr/conf.d/rules.conf
source = ~/.config/hypr/conf.d/binds.conf

# ---- General ----------------------------------------------------------------
monitor = ,preferred,auto,1
monitor = ,highres,auto,1

general {
    border_size = 2
    gaps_in = 5
    gaps_out = 12
    resize_on_border = true

    layout = dwindle
    no_border_on_floating = false
    hover_icon_on_border = true

    allow_tearing = false

    focus_on_activate = true
    focus_on_window = urgent

    disable_hyprland_logo = true
    disable_splash_rendering = true

    resize_corner = 0
    resize_on_active_border = true
}

decoration {
    rounding = 8
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 0.94
    fullscreen_opacity = 1.0

    active_shadow_color = rgba(1b2340cc)
    inactive_shadow_color = rgba(080a1266)
    active_shadow = 0 22 12 0
    inactive_shadow = 0 8 6 0

    dim_inactive = true
    dim_inactive_opacity = 0.72
    dim_inactive_special = 1.0
    dim_strong = 0.4
    dim_strength = 0.5
    dim_special = 0.6

    dim_around = 0.55
}

group {
    active_border_color   = $acento_principal e0
    inactive_border_color = $acento_secundario 55
    urgent_border_color   = #FF5F56 cc
    focused_border_color  = $acento_principal aa
}

animations {
    enabled = yes

    # Magia rapida al abrir, salida suave al cerrar.
    animation = breatheIn, 1, 5, 1
    animation = fadeIn, 1, 8, 1
    animation = fadeOut, 1, 6, 1
    animation = fadeInOut, 1, 4, 1
    animation = gnomeded, 1, 8, 1
    animation = spring, 1, 20, 0.7, 0.8
    animation = slidefadein, 1, 8, 1
    animation = slidefadeout, 1, 8, 1
    animation = slideInRight, 1, 8, easeOutQuint
    animation = slideOutRight, 1, 8, easeInQuint

    # Transiciones
    animation = windowslide, 1, 10, 1
    animation = slidefade, 1, 10, 1
    animation = slideinvert, 1, 10, 1
    animation = fade, 1, 8, 1
    animation = fuller, 1, 4, 1
    animation = fullerR, 1, 6, 1

    # Necesario para que los videos/games no se salten frames
    animation = monitor, 1, 12, 1
}

# ---- Capas ------------------------------------------------------------------
layers {
    blur_popups = true
    blur_underbar = false
    blur_special = true
    blur_underspecial = true
}

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    numlock_by_default = true
    follow_mouse = 1

    sensitivity = 0
    accel_profile = flat
    touchpad {
        natural_scroll = true
        tap_to_click = true
        disable_while_typing = true
        natural_scroll_button = false
        middle_button_emulation = true
        clickfinger_behavior = false
        scroll_factor = 0.5
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 260
    workspace_swipe_invert = true
}

device {
    name = stylus
    ignore = true
}
