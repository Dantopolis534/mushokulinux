# =============================================================================
#  hypridle.conf -- Cuando el mundo se detiene
#  Cierra: auro de Fittoa, se apaga la luz, se duerme el hechicero.
# =============================================================================

# 1) La pantalla se atenua a los 4 minutos
idle {
    lock = 1
    on_timeout = 240
    swayidle_command = loginctl lock-session
}

# 2) En 5 minutos entra hyprlock con el sello del Laberinto
idle {
    on_timeout = 300
    on_idle_resume = dim 0
    hyprlock_command = loginctl lock-session
}

# 3) A los 10 minutos la pantalla se apaga
idle {
    on_timeout = 600
    on_idle_resume = dpms on
    hyprlock_command = loginctl lock-session
}

# 4) A los 20 minutos se suspende
idle {
    on_timeout = 1200
    on_idle_resume = dpms on
    hyprlock_command = loginctl lock-session
}

# Sistema listo
exec-once = dbus-send --print-reply --dest=org.freedesktop.UPower \
    /org/freedesktop/UPower org.freedesktop.UPower.InhibitIdle \
    "inhibit" "suspend:idle" "Mushoku Tensei: Claude por inactividad"
