# =============================================================================
#  hyprpaper.conf -- El"Atardecer de Fittoa"
#  hyprpaper >= 0.9
# =============================================================================

preload = false
autowallpaper = true

# Imagen inicial (generada por cyberArch-Dotfiles, sin copyright)
paper = ${XC_WALLPAPER_DIR}/fittoa.png

# Como agregar tus propios fondos (fanarts, capturas, etc):
#   1. copia el .png/.jpg a  ~/.local/share/wallpapers/mushoku/
#   2. ejecuta:  hyprctl reload
#
# Como rotar entre varios:
#   1. ponlos en la misma carpeta
#   2. ejecuta:  swww img cycle --time 900  --order alphabetical  ~/.local/share/wallpapers/mushoku/*
#   3. para volver a hyprpaper:  hyprctl reload
#
# O bien con hyprpaper:
#   hyprctl hyprpaper wallpaper ",~/.local/share/wallpapers/mushoku/roxy.png"
