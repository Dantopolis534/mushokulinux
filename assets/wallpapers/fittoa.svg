<?xml version="1.0" encoding="UTF-8"?>
<!--
  cyberArch-Dotfiles :: Mushoku Tensei
  fittoa.svg :: Atardecer sobre el Gran Bosque

  Obra original creada para este repositorio.
  Solo usa la paleta cyberArch (themes/mushoku-tensei/colors.json).
  No contiene material del anime: circulo magico generativo, siluetas
  montanosas y estrellas colocadas de forma determinista.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Cielo -->
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.00" stop-color="#080A12"/>
      <stop offset="0.35" stop-color="#0B0E1A"/>
      <stop offset="0.62" stop-color="#121729"/>
      <stop offset="0.85" stop-color="#1B2340"/>
      <stop offset="1.00" stop-color="#26304F"/>
    </linearGradient>

    <!-- Aura magica central -->
    <radialGradient id="aura" cx="50%" cy="42%" r="55%">
      <stop offset="0.00" stop-color="#5BC8FF" stop-opacity="0.20"/>
      <stop offset="0.45" stop-color="#9B7BD4" stop-opacity="0.10"/>
      <stop offset="1.00" stop-color="#080A12" stop-opacity="0"/>
    </radialGradient>

    <!-- Luna -->
    <radialGradient id="luna" cx="50%" cy="50%" r="50%">
      <stop offset="0.00" stop-color="#ECEFF8" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#C9D4E8" stop-opacity="0.35"/>
      <stop offset="1.00" stop-color="#C9D4E8" stop-opacity="0"/>
    </radialGradient>

    <!-- Niebla del suelo -->
    <linearGradient id="niebla" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.00" stop-color="#9B7BD4" stop-opacity="0"/>
      <stop offset="1.00" stop-color="#9B7BD4" stop-opacity="0.14"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="suave" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1920" height="1080" fill="url(#cielo)"/>
  <rect width="1920" height="1080" fill="url(#aura)"/>

  <!-- Estrellas (deterministas) -->
  <g fill="#C9D4E8">
    <circle cx="120"  cy="90"  r="1.6" opacity="0.75"/>
    <circle cx="310"  cy="210" r="1.1" opacity="0.55"/>
    <circle cx="470"  cy="70"  r="1.9" opacity="0.85"/>
    <circle cx="605"  cy="170" r="1.2" opacity="0.60"/>
    <circle cx="740"  cy="120" r="1.5" opacity="0.70"/>
    <circle cx="880"  cy="240" r="1.0" opacity="0.45"/>
    <circle cx="1010" cy="80"  r="1.7" opacity="0.80"/>
    <circle cx="1140" cy="190" r="1.3" opacity="0.65"/>
    <circle cx="1275" cy="60"  r="1.4" opacity="0.70"/>
    <circle cx="1400" cy="150" r="1.1" opacity="0.50"/>
    <circle cx="1530" cy="95"  r="1.8" opacity="0.85"/>
    <circle cx="1650" cy="230" r="1.2" opacity="0.60"/>
    <circle cx="1770" cy="130" r="1.5" opacity="0.75"/>
    <circle cx="1880" cy="60"  r="1.0" opacity="0.45"/>
    <circle cx="240"  cy="330" r="1.2" opacity="0.50"/>
    <circle cx="820"  cy="350" r="1.1" opacity="0.40"/>
    <circle cx="1350" cy="330" r="1.3" opacity="0.55"/>
    <circle cx="1700" cy="390" r="1.0" opacity="0.40"/>
  </g>

  <!-- Luna plateada (Ghislaine) -->
  <circle cx="1560" cy="220" r="190" fill="url(#luna)" filter="url(#suave)"/>
  <circle cx="1560" cy="220" r="54" fill="#ECEFF8" opacity="0.72"/>
  <circle cx="1543" cy="208" r="11" fill="#8E9AB8" opacity="0.35"/>
  <circle cx="1578" cy="236" r="8"  fill="#8E9AB8" opacity="0.28"/>

  <!-- Circulo magico principal (Roxy: agua, Eris: fuego) -->
  <g transform="translate(880 470)" fill="none" stroke-linecap="round">
    <circle r="300" stroke="#5BC8FF" stroke-width="1.4" opacity="0.30"/>
    <circle r="262" stroke="#9B7BD4" stroke-width="1.0" opacity="0.26"/>
    <circle r="224" stroke="#5BC8FF" stroke-width="0.9" opacity="0.22"/>
    <circle r="186" stroke="#E0B354" stroke-width="0.9" opacity="0.20"/>

    <!-- Poligono exterior de 12 lados -->
    <polygon points="300,0 259.8,150 150,259.8 0,300 -150,259.8 -259.8,150 -300,0 -259.8,-150 -150,-259.8 0,-300 150,-259.8 259.8,-150"
             stroke="#5BC8FF" stroke-width="1.2" opacity="0.34"/>
    <!-- Poligono interior de 8 lados -->
    <polygon points="224,0 158.4,158.4 0,224 -158.4,158.4 -224,0 -158.4,-158.4 0,-224 158.4,-158.4"
             stroke="#9B7BD4" stroke-width="1.2" opacity="0.30"/>
    <!-- Rombo -->
    <polygon points="0,-150 106,0 0,150 -106,0"
             stroke="#FF5F56" stroke-width="1.3" opacity="0.34"/>

    <!-- Corazones de Sylphie (viento) -->
    <g stroke="#5FD98A" stroke-width="1.5" opacity="0.34">
      <path d="M 0,-262 l 14,-22 a 15,15 0 0,1 26,0 l 14,22 a 17,17 0 0,1 -27,15 l -13,11 l -13,-11 a 17,17 0 0,1 -27,-15 z"/>
      <path d="M 0,262 l 14,-22 a 15,15 0 0,1 26,0 l 14,22 a 17,17 0 0,1 -27,15 l -13,11 l -13,-11 a 17,17 0 0,1 -27,-15 z"/>
    </g>

    <!-- Estrellas del sello de Orsted -->
    <g stroke="#E0B354" stroke-width="1.4" opacity="0.40">
      <path d="M -224,-110 h 18 M -215,-110 v 18 M 206,-110 h 18 M 215,-110 v 18"/>
      <path d="M -224,110 h 18 M -215,110 v -18 M 206,110 h 18 M 215,110 v -18"/>
    </g>
  </g>

  <!-- Montanas lejanas -->
  <path d="M 0,760 L 180,690 L 330,745 L 520,650 L 690,735 L 880,665 L 1060,740 L 1240,670 L 1420,745 L 1600,685 L 1790,750 L 1920,700 L 1920,1080 L 0,1080 Z"
        fill="#121729" opacity="0.85"/>

  <!-- Montanas cercanas (mas oscuras) -->
  <path d="M 0,860 L 220,800 L 420,855 L 640,780 L 900,850 L 1150,790 L 1400,860 L 1620,800 L 1820,855 L 1920,825 L 1920,1080 L 0,1080 Z"
        fill="#0B0E1A" opacity="0.95"/>

  <!-- Niebla -->
  <rect x="0" y="700" width="1920" height="380" fill="url(#niebla)"/>

  <!-- Suelo -->
  <rect x="0" y="1000" width="1920" height="80" fill="#080A12"/>

  <!-- Motas de luz (particulas magicas) -->
  <g filter="url(#glow)">
    <circle cx="300"  cy="880" r="2.6" fill="#5BC8FF" opacity="0.60"/>
    <circle cx="540"  cy="930" r="2.0" fill="#9B7BD4" opacity="0.50"/>
    <circle cx="760"  cy="870" r="2.8" fill="#E0B354" opacity="0.55"/>
    <circle cx="1010" cy="945" r="2.2" fill="#5FD98A" opacity="0.45"/>
    <circle cx="1260" cy="885" r="2.6" fill="#5BC8FF" opacity="0.55"/>
    <circle cx="1480" cy="940" r="2.0" fill="#FF5F56" opacity="0.45"/>
    <circle cx="1700" cy="875" r="2.4" fill="#9B7BD4" opacity="0.50"/>
  </g>
</svg>
