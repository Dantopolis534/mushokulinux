<?xml version="1.0" encoding="UTF-8"?>
<!--
  cyberArch-Dotfiles :: Mushoku Tensei
  eris.svg :: Magia de fuego

  Obra original creada para este repositorio.
  Paleta de Eris Boreas Greyrat: rojo fuego, con brasas doradas.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="cieloE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.00" stop-color="#0A0508"/>
      <stop offset="0.40" stop-color="#140709"/>
      <stop offset="0.72" stop-color="#24090C"/>
      <stop offset="1.00" stop-color="#3A0F12"/>
    </linearGradient>

    <radialGradient id="auraE" cx="50%" cy="52%" r="58%">
      <stop offset="0.00" stop-color="#FF5F56" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#E0B354" stop-opacity="0.10"/>
      <stop offset="1.00" stop-color="#0A0508" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="llamaGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0.00" stop-color="#FF5F56" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#E0B354" stop-opacity="0.70"/>
      <stop offset="1.00" stop-color="#E0B354" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.00" stop-color="#5A1410"/>
      <stop offset="1.00" stop-color="#0A0508"/>
    </linearGradient>

    <filter id="glowE" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#cieloE)"/>
  <rect width="1920" height="1080" fill="url(#auraE)"/>

  <!-- Humo en el cielo -->
  <g fill="#FF5F56" opacity="0.06">
    <ellipse cx="400"  cy="260" rx="340" ry="120"/>
    <ellipse cx="980"  cy="180" rx="300" ry="100"/>
    <ellipse cx="1520" cy="300" rx="380" ry="130"/>
  </g>

  <!-- Circulo de fuego -->
  <g transform="translate(960 500)" fill="none" stroke-linecap="round">
    <circle r="290" stroke="#FF5F56" stroke-width="1.6" opacity="0.36"/>
    <circle r="244" stroke="#E0B354" stroke-width="1.1" opacity="0.28"/>
    <circle r="198" stroke="#FF5F56" stroke-width="1.0" opacity="0.24"/>

    <!-- Pentagono de invocacion -->
    <polygon points="0,-290 272,-90 168,235 -168,235 -272,-90"
             stroke="#FF5F56" stroke-width="1.5" opacity="0.42"/>
    <polygon points="0,-244 -228,78 141,197 -141,197 228,78"
             stroke="#E0B354" stroke-width="1.2" opacity="0.30"/>

    <!-- Puntas del pentagono -->
    <g stroke="#E0B354" stroke-width="1.6" opacity="0.45">
      <path d="M 0,-290 l -11,26 l 22,0 z"/>
      <path d="M 272,-90 l -24,13 l 10,22 z"/>
      <path d="M 168,235 l -5,-25 l 25,5 z"/>
      <path d="M -168,235 l 5,-25 l -25,5 z"/>
      <path d="M -272,-90 l 24,13 l -10,22 z"/>
    </g>
  </g>

  <!-- Espada de fuego (vertical, centro) -->
  <g transform="translate(960 500)" filter="url(#glowE)">
    <!-- Hoja -->
    <path d="M 0,-330 L 20,-250 L 14,120 L -14,120 L -20,-250 Z"
          fill="url(#llamaGrad)" opacity="0.80"/>
    <path d="M 0,-330 L 20,-250 L 14,120 L -14,120 L -20,-250 Z"
          fill="none" stroke="#ECEFF8" stroke-width="1.4" opacity="0.55"/>
    <!-- Guarda -->
    <rect x="-78" y="120" width="156" height="14" rx="7" fill="#E0B354" opacity="0.80"/>
    <circle cx="0" cy="127" r="9" fill="#FF5F56" opacity="0.90"/>
    <!-- Empuñadura -->
    <rect x="-9" y="134" width="18" height="86" rx="9" fill="#2A1418"/>
    <circle cx="0" cy="228" r="15" fill="none" stroke="#E0B354" stroke-width="3" opacity="0.75"/>
  </g>

  <!-- Lenguas de fuego -->
  <g filter="url(#glowE)">
    <path d="M 120,900 C 130,800 150,760 140,690 C 190,760 200,810 190,900 Z"
          fill="#FF5F56" opacity="0.35"/>
    <path d="M 1720,920 C 1730,820 1750,780 1740,710 C 1790,780 1800,830 1790,920 Z"
          fill="#E0B354" opacity="0.30"/>
    <path d="M 1560,940 C 1568,850 1586,815 1578,755 C 1622,815 1630,860 1622,940 Z"
          fill="#FF5F56" opacity="0.28"/>
    <path d="M 360,950 C 368,860 386,825 378,765 C 422,825 430,870 422,950 Z"
          fill="#E0B354" opacity="0.26"/>
  </g>

  <!-- Suelo de lava -->
  <path d="M 0,960 L 240,925 L 520,965 L 820,915 L 1120,960 L 1420,920 L 1700,965 L 1920,930 L 1920,1080 L 0,1080 Z"
        fill="url(#lava)"/>

  <!-- Grietas de magma -->
  <g stroke="#FF5F56" stroke-width="2" opacity="0.55" fill="none" filter="url(#glowE)">
    <path d="M 120,1000 h 140 M 320,1030 h 190 M 620,995 h 170 M 880,1035 h 200 M 1180,1000 h 160 M 1440,1030 h 200 M 1700,995 h 150"/>
  </g>

  <!-- Brasas ascendentes -->
  <g filter="url(#glowE)">
    <circle cx="420"  cy="700" r="2.8" fill="#E0B354" opacity="0.70"/>
    <circle cx="660"  cy="580" r="2.2" fill="#FF5F56" opacity="0.60"/>
    <circle cx="900"  cy="700" r="3.0" fill="#E0B354" opacity="0.65"/>
    <circle cx="1150" cy="560" r="2.4" fill="#FF5F56" opacity="0.55"/>
    <circle cx="1400" cy="720" r="2.8" fill="#E0B354" opacity="0.60"/>
    <circle cx="1640" cy="600" r="2.2" fill="#FF5F56" opacity="0.50"/>
  </g>
</svg>
